<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Widget</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    overflow: hidden;
  }
  #orb { display: block; }
  /* Caption pill: the ONLY text. Fades in under the orb when there is
     something to show; fades out on its own when JARVIS goes quiet. */
  #caption {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 10px; text-align: center;
    color: #dff4ff;
    /* no background, no box — just text with a soft shadow for readability */
    text-shadow: 0 1px 6px rgba(0,0,0,0.85), 0 0 8px rgba(84,216,255,0.35);
    /* strictly one line; long text trims with an ellipsis */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 146px; margin-top: 4px;
    opacity: 0; transition: opacity 0.45s ease;
  }
</style>
</head>
<body>
  <canvas id="orb" width="150" height="150"></canvas>
  <div id="caption"></div>
<script>
  "use strict";
  /* JARVIS mini widget — Siri-sized. Just the particle orb with its
     arc-reactor core, floating frameless and transparent. No panel,
     no text: the state reads from the animation alone.
       idle      — small, dim, slow breathing (sits quietly)
       listening — expands, bright pulse, ripple rings
       thinking  — spins up, one sweeping arc
       working   — spins faster, double arcs + dashed rotating ring
       speaking  — rhythmic voice-cadence pulse
     State comes from polling /api/state (HTTP, same as the main HUD).
     Preview all states without the app: open this file with ?demo=1. */
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');

  const CX = canvas.width / 2, CY = canvas.height / 2;
  const BASE_R = 44;
  const N = 430;
  const FOCAL = 210;

  /* Fibonacci sphere: evenly spread points on a sphere. */
  const pts = [];
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const rad = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = GOLDEN * i;
    pts.push({ x: Math.cos(theta) * rad, y: y, z: Math.sin(theta) * rad });
  }

  let state = 'idle';
  let rotY = 0;
  let t = 0;

  function stateParams() {
    switch (state) {
      case 'listening':
        return { spin: 0.004, scale: 1.05 + 0.10 * Math.sin(t * 5.2), bright: 1.0 };
      case 'thinking':
        return { spin: 0.012, scale: 0.95 + 0.02 * Math.sin(t * 2.4), bright: 0.9 };
      case 'working':
        return { spin: 0.017, scale: 0.97 + 0.015 * Math.sin(t * 3.1), bright: 0.95 };
      case 'speaking':
        return { spin: 0.005, scale: 1.0 + 0.06 * Math.sin(t * 9.0) * (0.6 + 0.4 * Math.sin(t * 1.7)), bright: 0.95 };
      default: /* idle — deliberately small and quiet */
        return { spin: 0.0032, scale: 0.76 + 0.02 * Math.sin(t * 0.9), bright: 0.7 };
    }
  }

  function draw() {
    t += 1 / 60;
    const p = stateParams();
    rotY += p.spin;
    const tilt = 0.42;
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const R = BASE_R * p.scale;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* soft halo */
    const halo = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 1.5);
    halo.addColorStop(0, 'rgba(84,216,255,' + (0.12 * p.bright) + ')');
    halo.addColorStop(1, 'rgba(84,216,255,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* faint reactor ring + Mark VI triangle */
    ctx.strokeStyle = 'rgba(84,216,255,0.13)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CX, CY, R * 0.99, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const ang = Math.PI / 2 + k * (Math.PI * 2 / 3) + rotY * 0.15;
      const vx = CX + Math.cos(ang) * R * 0.92;
      const vy = CY + Math.sin(ang) * R * 0.92;
      k === 0 ? ctx.moveTo(vx, vy) : ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.stroke();

    /* particle sphere */
    for (let i = 0; i < N; i++) {
      const pt = pts[i];
      const x1 = pt.x * cosY + pt.z * sinY;
      const z1 = -pt.x * sinY + pt.z * cosY;
      const y2 = pt.y * cosT - z1 * sinT;
      const z2 = pt.y * sinT + z1 * cosT;
      const persp = FOCAL / (FOCAL + z2 * R);
      let sx = CX + x1 * R * persp;
      let sy = CY + y2 * R * persp;
      /* Clamp: no dot ever renders outside the ring. Perspective makes
         front dots bulge past the circle — pull them back to the edge. */
      const dxo = sx - CX, dyo = sy - CY;
      const dist = Math.sqrt(dxo * dxo + dyo * dyo);
      const maxD = R * 0.98;
      if (dist > maxD) { sx = CX + dxo * maxD / dist; sy = CY + dyo * maxD / dist; }
      const depth = (1 - z2) / 2;
      const r = 0.4 + depth * 0.9;
      const a = (0.12 + depth * 0.75) * p.bright;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = depth > 0.72
        ? 'rgba(235,250,255,' + a + ')'
        : 'rgba(150,215,255,' + a + ')';
      ctx.fill();
    }

    /* arc-reactor core + ring of 10 lights */
    const coreR = 8.5 * p.scale * (state === 'listening' ? 1.15 : 1);
    const core = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR * 2.4);
    core.addColorStop(0, 'rgba(255,255,255,' + (0.95 * p.bright) + ')');
    core.addColorStop(0.35, 'rgba(190,240,255,' + (0.75 * p.bright) + ')');
    core.addColorStop(1, 'rgba(84,216,255,0)');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(CX, CY, coreR * 2.4, 0, Math.PI * 2);
    ctx.fill();
    for (let k = 0; k < 10; k++) {
      const ang = -rotY * 0.6 + k * (Math.PI * 2 / 10);
      const dx = CX + Math.cos(ang) * 19 * p.scale;
      const dy = CY + Math.sin(ang) * 19 * p.scale;
      ctx.beginPath();
      ctx.arc(dx, dy, 1.3, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(220,248,255,' + (0.85 * p.bright) + ')';
      ctx.fill();
    }

    /* state flourishes */
    if (state === 'listening') {
      for (let k = 0; k < 3; k++) {
        const phase = (t * 0.75 + k / 3) % 1;
        ctx.beginPath();
        ctx.arc(CX, CY, R * (0.4 + 0.6 * phase), 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(160,230,255,' + ((1 - phase) * 0.28) + ')';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    }
    if (state === 'thinking') {
      /* one bright arc sweeping the ring */
      const start = rotY * 4;
      ctx.beginPath();
      ctx.arc(CX, CY, R * 1.05, start, start + Math.PI * 0.75);
      ctx.strokeStyle = 'rgba(190,242,255,0.55)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(CX, CY, R * 1.05, start + Math.PI, start + Math.PI * 1.25);
      ctx.strokeStyle = 'rgba(84,216,255,0.30)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
    if (state === 'working') {
      /* faster: double sweep arcs + a rotating dashed outer ring */
      const start = rotY * 5;
      ctx.beginPath();
      ctx.arc(CX, CY, R * 1.05, start, start + Math.PI * 0.6);
      ctx.strokeStyle = 'rgba(190,242,255,0.6)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(CX, CY, R * 1.05, start + Math.PI, start + Math.PI * 0.6);
      ctx.strokeStyle = 'rgba(190,242,255,0.6)';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.lineDashOffset = -rotY * 30;
      ctx.beginPath();
      ctx.arc(CX, CY, R * 1.14, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(84,216,255,0.35)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();

  /* Caption pill: shows the current task / what's being heard / the
     reply gist. Fades in when text arrives; fades out ~3s after the
     last update, so idle = orb only. */
  const captionEl = document.getElementById('caption');
  let hideTimer = null;
  function showCaption(txt) {
    captionEl.textContent = txt;
    captionEl.style.opacity = '1';
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { captionEl.style.opacity = '0'; }, 3000);
  }
  function scheduleHide(ms) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { captionEl.style.opacity = '0'; }, ms);
  }

  /* State via HTTP polling — same channel as the main HUD. */
  function poll() {
    fetch('/api/state').then(r => r.json()).then(s => {
      if (s.state) state = String(s.state).toLowerCase();
      let txt = s.task || '';
      if (!txt && (state === 'listening' || state === 'speaking')) txt = s.transcript || '';
      if (!txt && state === 'listening') txt = 'Listening…';
      if (!txt && (state === 'thinking' || state === 'working')) txt = 'Working…';
      if (txt) showCaption(txt); else scheduleHide(1500);
    }).catch(() => { state = 'idle'; scheduleHide(800); });
  }

  /* DEMO MODE — open widget.html?demo=1 (e.g. double-click the file and
     add ?demo=1, or load it in any browser) and the widget cycles through
     ALL states by itself, ~4s each, with sample captions. Without this the
     file opened standalone can only ever show idle, because /api/state
     does not exist outside the app. Keys 1-5 also jump to a state:
     1 idle · 2 listening · 3 thinking · 4 working · 5 speaking. */
  const DEMO = new URLSearchParams(location.search).has('demo');
  const DEMO_STATES = ['idle', 'listening', 'thinking', 'working', 'speaking'];
  const DEMO_TEXT = {
    idle: '', listening: 'Listening…', thinking: 'Thinking…',
    working: 'Searching your files', speaking: 'Done, sir. Files moved.'
  };
  let demoIdx = 0;
  function applyDemo() {
    const txt = DEMO_TEXT[state];
    if (txt) showCaption(txt); else scheduleHide(60);
  }
  if (DEMO) {
    state = DEMO_STATES[0];
    applyDemo();
    setInterval(() => {
      demoIdx = (demoIdx + 1) % DEMO_STATES.length;
      state = DEMO_STATES[demoIdx];
      applyDemo();
    }, 4000);
  } else {
    setInterval(poll, 2000);
    poll();
  }
  document.addEventListener('keydown', (e) => {
    const map = { '1': 'idle', '2': 'listening', '3': 'thinking', '4': 'working', '5': 'speaking' };
    if (map[e.key]) {
      state = map[e.key];
      if (DEMO) { demoIdx = DEMO_STATES.indexOf(state); applyDemo(); }
    }
  });
</script>
</body>
</html>
